<!-- SoulTrak\UI\templates\settings.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoulTrak - Settings</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style-' + theme + '.css') }}">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="nav-left">
        <a href="{{ url_for('home') }}"><h1>SoulTrak</h1></a>
      </div>
      <div class="nav-right">
        <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
        <a href="{{ url_for('ai_page') }}">🤖 AI</a>
        <a href="{{ url_for('progress') }}">📈 Progress</a>
        <a href="{{ url_for('settings') }}">⚙️ Settings</a>
        <a href="#">👤 Profile</a>
      </div>
    </nav>
  </header>

  <section class="hero">
    <h2>🎨 Theme Settings</h2>
    <form method="POST">
  <label for="theme">Choose Theme:</label>
  <select name="theme" id="theme">
    <option value="solo" {% if theme == "solo" %}selected{% endif %}>Solo</option>
    <option value="dark" {% if theme == "dark" %}selected{% endif %}>Dark</option>
  </select>
  <button type="submit">Save</button>
</form>

  </section>

  <footer>
    <p>Made with ❤️ by Vikas Dhruw • SoulTrak 2025</p>
  </footer>

</body>
</html>
