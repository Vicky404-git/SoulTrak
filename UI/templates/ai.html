<!-- SoulTrak\UI\templates\ai.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoulTrak: AI View</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style-' + theme + '.css') }}">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 10px; text-align: center; }
    th { background-color: #222; color: #fff; }
    .error { color: red; margin-top: 20px; }
    pre { white-space: pre-wrap; background-color: #1e1e1e; color: #eee; padding: 15px; border-radius: 8px; }
    form { margin-top: 20px; }
    textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 10px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <nav class="navbar">
      <div class="nav-left">
        <a href="{{ url_for('home') }}"><h1>SoulTrak</h1></a>
      </div>
      <div class="nav-right">
        <a href="{{ url_for('dashboard') }}">🏠 Dashboard</a>
        <a href="{{ url_for('ai_page') }}">🤖 AI</a>
        <a href="{{ url_for('progress') }}">📈 Progress</a>
        <a href="{{ url_for('settings') }}">⚙️ Settings</a>
        <a href="#">👤 Profile</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <section class="hero">
    <h2>📊 SoulTrak: AI-Based Daily Tracker</h2>
    <p>Your logs, enhanced with brain-like AI feedback.</p>

    <div id="table-container">
      {{ table_html|safe }}
    </div>

    <h2>💬 Chat with AI</h2>
    <form method="POST">
      <textarea name="user_input" placeholder="Ask AI something..."></textarea>
      <button type="submit">Submit</button>
    </form>

    {% if ai_feedback %}
      <h2>🤖 AI Feedback</h2>
      <pre>{{ ai_feedback }}</pre>
    {% endif %}
  </section>

  <footer>
    <p>Made with ❤️ by Vikas Dhruw • SoulTrak 2025</p>
  </footer>

</body>
</html>
