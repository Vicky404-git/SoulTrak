<!-- SoulTrak\UI\templates\ai.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SoulTrak: AI View</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style-' + theme + '.css') }}">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 10px; text-align: center; }
    th { background-color: #222; color: #fff; }
    .error { color: red; margin-top: 20px; }
    
    pre { 
      white-space: pre-wrap; 
      background-color: #1e1e1e; 
      color: #eee; 
      padding: 15px; 
      border-radius: 8px; 
      font-family: monospace; 
      font-size: 0.85rem;
      text-align: left;  
    }
    
    form { margin-top: 20px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; }
    textarea { width: 100%; height: 80px; padding: 10px; margin-top: 10px; margin-bottom: 10px; box-sizing: border-box; }
    select { padding: 8px; width: 100%; margin-bottom: 15px; }
    button { padding: 10px 20px; cursor: pointer; font-weight: bold; }
    .divider { text-align: center; margin: 10px 0; font-weight: bold; color: #888; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="nav-left">
        <a href="{{ url_for('home') }}"><h1>SoulTrak</h1></a>
      </div>
      <div class="nav-right">
        <a href="{{ url_for('dashboard') }}">🏠 Dashboard</a>
        <a href="{{ url_for('ai_page') }}">🤖 AI</a>
        <a href="{{ url_for('progress') }}">📈 Progress</a>
        <a href="{{ url_for('settings') }}">⚙️ Settings</a>
        <a href="#">👤 Profile</a>
      </div>
    </nav>
  </header>

  <section class="hero">
    <h2>📊 Recent Tracker Logs</h2>
    <div id="table-container">
      {{ table_html|safe }}
    </div>

    <h2>💬 Consult Brian AI</h2>
    <form method="POST">
      <label for="prompt_choice"><strong>Option A: Choose a standard analysis preset:</strong></label>
      <select name="prompt_choice" id="prompt_choice">
        <option value="">-- Select Preset Options --</option>
        {% for key in prompt_keys %}
          <option value="{{ key }}">{{ key }}</option>
        {% endfor %}
      </select>

      <div class="divider">OR</div>

      <label for="user_input"><strong>Option B: Ask Brian a custom question directly:</strong></label>
      <textarea name="user_input" id="user_input" placeholder="e.g., How much total time did I spend coding this week? Did I take enough breaks?"></textarea>
      
      <button type="submit">⚡ Ask Brian</button>
    </form>

    {% if ai_feedback %}
      <h2>🤖 Brian's Response</h2>
      <pre>{{ ai_feedback }}</pre>
    {% endif %}
  </section>

  <footer>
    <p>Made with ❤️ by Vikas Dhruw • SoulTrak 2025</p>
  </footer>

</body>
</html>
